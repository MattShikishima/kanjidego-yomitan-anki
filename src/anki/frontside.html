<!-- [html-validate-disable no-inline-style] -->
<!-- [html-validate-disable void-style] -->

<div lang="ja">
  <!-- Top right tags -->
  <div
    style="
      display: flex;
      justify-content: flex-end;
      position: absolute;
      top: 1em;
      right: 1em;
      gap: 0.5em;
      font-size: 0.6em;
    "
  >
    <!-- 別表記 Tag -->
    {{#元単語}}
    <span
      style="
        border: 1px solid;
        border-color: #a30000;
        border-radius: 0.5em;
        padding: 0.1em 0.4em;
        color: #a30000;
      "
    >
      別表記
    </span>
    {{/元単語}}

    <!-- Kanjidego Level -->
    {{#レベル}}
    <span
      style="
        border: 1px solid;
        border-color: #7b7b7b;
        border-radius: 0.5em;
        padding: 0.1em 0.4em;
      "
    >
      レベル{{レベル}}
    </span>
    {{/レベル}}
  </div>

  <!-- Expression -->
  <div
    id="expression"
    class="rarefont"
    style="
      margin-top: 1em;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.2em 1em;
    "
  >
    {{^元単語}}
    <!-- Show image if not alt form. 画像 (full image — question plus any hints
    or disambiguation) by default; 切り抜き画像 (a crop of 画像 with the hints/
    disambiguation removed, question only) on hover, kept only so people who
    prefer the old default can swap back to it. -->
    <div id="quiz-image" style="display: inline-flex; position: relative">
      {{画像}}
    </div>
    <div id="quiz-image-hint" style="display: none">{{切り抜き画像}}</div>

    <!-- Main form hid on front by default -->
    <div id="main-form" style="display: none; font-size: 2em; color: gray">
      <a
        href="#"
        onclick="copyTextOnClick('expression')"
        style="color: inherit; text-decoration: none"
      >
        {{単語}}
      </a>
    </div>
    {{/元単語}}

    <!-- Show main form only if alt form -->
    {{#元単語}}
    <div style="font-size: 3.5em">
      <a
        href="#"
        onclick="copyTextOnClick('expression')"
        style="color: inherit; text-decoration: none"
      >
        {{単語}}
      </a>
    </div>
    {{/元単語}}
  </div>
</div>

<div
  id="toast"
  lang="ja"
  style="
    position: fixed;
    top: 1em;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 0.5em 1em;
    border-radius: 0.5em;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: -5;
    font-size: 0.7em;
  "
>
  テキストをコピーしました。
</div>

<script>
  function copyTextOnClick(id) {
    const elem = document.getElementById(id);
    const text = elem.textContent.replace(/[\n\r]/g, ' ').trim();
    copyText(text);
    showFeedback('toast', 700);
  }

  function copyText(text) {
    const range = document.createRange();
    const tempElem = document.createElement('div');
    tempElem.textContent = text;
    document.body.appendChild(tempElem);
    range.selectNode(tempElem);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    document.execCommand('copy');
    document.body.removeChild(tempElem);
  }

  function showFeedback(elementId, duration) {
    const element = document.getElementById(elementId);
    element.style.opacity = 1;
    element.style.zIndex = 9999;
    setTimeout(() => {
      element.style.opacity = 0;
      element.style.zIndex = -5;
    }, duration);
  }

  // Size the quiz image (from the 画像 field) and swap to the cropped
  // image (the 切り抜き画像 field) on hover.
  (() => {
    const quizImage = document.getElementById('quiz-image');
    const full = quizImage && quizImage.querySelector('img');
    if (!full) return;
    full.style.height = '3.5em';
    full.style.objectFit = 'contain';
    const hintHolder = document.getElementById('quiz-image-hint');
    const hint = hintHolder && hintHolder.querySelector('img');
    if (!hint) return;
    const fullSrc = full.getAttribute('src');
    const hintSrc = hint.getAttribute('src');
    full.addEventListener('mouseover', () => full.setAttribute('src', hintSrc));
    full.addEventListener('mouseout', () => full.setAttribute('src', fullSrc));
  })();
</script>
